name: Sync Release to Gitee

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      tag:
        description: '手动指定要同步的 tag（如 v1.0.0）'
        required: true
      prerelease:
        description: '是否为 pre-release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync release to Gitee
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name || github.event.inputs.tag }}
          RELEASE_BODY: ${{ toJSON(github.event.release.body) }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish || 'main' }}
          PRERELEASE: ${{ github.event.release.prerelease || github.event.inputs.prerelease || false }}
          IS_RELEASE_EVENT: ${{ github.event_name == 'release' }}
          RELEASE_ACTION: ${{ github.event.action }}
          GH_ASSETS: ${{ toJSON(github.event.release.assets) }}
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # --- Skip unwanted events ---
          if [ "${IS_RELEASE_EVENT}" = "true" ]; then
            case "${RELEASE_ACTION}" in
              unpublished|created)
                echo "=== Skipping action: ${RELEASE_ACTION} ==="
                exit 0
                ;;
            esac
          fi

          API_BASE="https://gitee.com/api/v5/repos/${GITEE_USERNAME}/${GITEE_REPO}"
          AUTH="access_token=${GITEE_TOKEN}"

          # --- Handle delete: remove release from Gitee ---
          if [ "${IS_RELEASE_EVENT}" = "true" ] && [ "${RELEASE_ACTION}" = "deleted" ]; then
            echo "=== Deleting release ${TAG} from Gitee ==="
            EXISTING=$(curl -s -w "\n%{http_code}" \
              "${API_BASE}/releases/tags/${TAG}?${AUTH}")
            EXISTING_BODY=$(echo "$EXISTING" | sed '$d')
            RELEASE_ID=$(echo "$EXISTING_BODY" | jq -r '.id // empty')

            if [ -n "$RELEASE_ID" ]; then
              curl -s -X DELETE \
                "${API_BASE}/releases/${RELEASE_ID}?${AUTH}"
              echo "✅ Release ${TAG} deleted from Gitee"
            else
              echo "=== Release not found on Gitee, nothing to delete ==="
            fi
            exit 0
          fi

          # --- For workflow_dispatch, fetch release info + assets from GitHub API ---
          if [ "${IS_RELEASE_EVENT}" != "true" ]; then
            echo "=== Fetching release info from GitHub API for tag ${TAG} ==="
            GH_RELEASE=$(curl -s -H "Authorization: token ${GH_TOKEN}" \
              "https://api.github.com/repos/${GH_REPO}/releases/tags/${TAG}")

            if echo "$GH_RELEASE" | jq -e '.id' >/dev/null 2>&1; then
              RELEASE_NAME=$(echo "$GH_RELEASE" | jq -r '.name // .tag_name')
              RELEASE_BODY=$(echo "$GH_RELEASE" | jq '.body')
              TARGET_COMMITISH=$(echo "$GH_RELEASE" | jq -r '.target_commitish')
              PRERELEASE=$(echo "$GH_RELEASE" | jq '.prerelease')
              GH_ASSETS=$(echo "$GH_RELEASE" | jq '.assets')
              echo "Fetched: name=${RELEASE_NAME}, prerelease=${PRERELEASE}"
            else
              echo "=== Release not found on GitHub, using defaults ==="
              RELEASE_NAME="${TAG}"
              RELEASE_BODY='""'
              TARGET_COMMITISH="main"
              PRERELEASE="false"
              GH_ASSETS='[]'
            fi
          fi

          ASSET_COUNT=$(echo "$GH_ASSETS" | jq 'length')

          echo "=== DEBUG ==="
          echo "TAG: ${TAG}"
          echo "IS_RELEASE_EVENT: ${IS_RELEASE_EVENT}"
          echo "RELEASE_ACTION: ${RELEASE_ACTION:-manual}"
          echo "GitHub assets: ${ASSET_COUNT}"
          echo "=============="

          # --- Build payload ---
          PAYLOAD=$(jq -n \
            --arg tag_name "$TAG" \
            --arg name "$RELEASE_NAME" \
            --argjson body "$RELEASE_BODY" \
            --arg target_commitish "$TARGET_COMMITISH" \
            --argjson prerelease "$PRERELEASE" \
            '{tag_name: $tag_name, name: $name, body: $body, target_commitish: $target_commitish, prerelease: $prerelease}')

          # --- Create or update release on Gitee ---
          echo "=== Checking Gitee for release ${TAG} ==="
          EXISTING=$(curl -s -w "\n%{http_code}" \
            "${API_BASE}/releases/tags/${TAG}?${AUTH}")
          EXISTING_HTTP=$(echo "$EXISTING" | tail -1)
          EXISTING_BODY=$(echo "$EXISTING" | sed '$d')

          RELEASE_ID=$(echo "$EXISTING_BODY" | jq -r '.id // empty')
          if [ -n "$RELEASE_ID" ]; then
            echo "=== Updating release (id=${RELEASE_ID}) ==="
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
              "${API_BASE}/releases/${RELEASE_ID}?${AUTH}" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
          else
            echo "=== Creating release ==="
            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "${API_BASE}/releases?${AUTH}" \
              -H "Content-Type: application/json" -d "$PAYLOAD")
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | sed '$d')

          if ! [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "❌ Failed to sync release (HTTP $HTTP_CODE)"
            echo "$BODY_RESP"
            exit 1
          fi

          echo "✅ Release synced: $TAG"
          RELEASE_ID=$(echo "$BODY_RESP" | jq -r '.id')
          echo "Gitee release id: $RELEASE_ID"

          # --- Sync assets ---
          if [ "$ASSET_COUNT" -eq 0 ]; then
            echo "=== No assets to sync ==="
            exit 0
          fi

          echo "=== Syncing ${ASSET_COUNT} asset(s) ==="

          WORKDIR=$(mktemp -d)
          FAILED=0
          echo "$GH_ASSETS" | jq -c '.[]' | while read -r asset; do
            ASSET_NAME=$(echo "$asset" | jq -r '.name')
            ASSET_URL=$(echo "$asset" | jq -r '.browser_download_url')

            echo "Downloading: ${ASSET_NAME}"
            if ! curl -fsSL --retry 3 --retry-delay 5 \
              -o "${WORKDIR}/${ASSET_NAME}" \
              -H "Authorization: token ${GH_TOKEN}" "$ASSET_URL"; then
              echo "❌ Download failed: ${ASSET_NAME}"
              continue
            fi

            ASSET_SIZE=$(stat -c%s "${WORKDIR}/${ASSET_NAME}" 2>/dev/null || echo 0)
            echo "Uploading to Gitee: ${ASSET_NAME} ($(numfmt --to=iec ${ASSET_SIZE} 2>/dev/null || echo ${ASSET_SIZE} bytes))"
            if curl -fSL --progress-bar --connect-timeout 30 --max-time 1800 --retry 3 --retry-delay 5 \
              -X POST "${API_BASE}/releases/${RELEASE_ID}/attach_files?${AUTH}" \
              -F "file=@${WORKDIR}/${ASSET_NAME}" 2>&1; then
              echo ""
              echo "✅ Asset synced: ${ASSET_NAME}"
            else
              echo ""
              echo "❌ Upload failed: ${ASSET_NAME}"
            fi

            rm -f "${WORKDIR}/${ASSET_NAME}"
          done

          rm -rf "$WORKDIR"
          echo "=== Done ==="
