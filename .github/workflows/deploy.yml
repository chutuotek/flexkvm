name: Deploy MkDocs Documentation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'Docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Blacklist: tags to skip during mike deploy (space-separated)
env:
  MIKE_BLACKLIST: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for mike to read tags

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 依赖安装复用 build.sh，避免清单在 CI 与脚本里各维护一份
      - name: Install dependencies
        working-directory: Docs
        run: ./build.sh deps

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # =========================================================================
      # Step 1: Build server version (isolated clone)
      # 自建站：含 ICP 备案号 → gh-pages-server 分支 → SSH 同步到自有服务器
      # =========================================================================
      - name: Build server version - Prepare isolated workspace
        run: |
          echo "=== Creating isolated workspace for server build ==="
          git clone . ../repo-server --no-local
          cd ../repo-server
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build server version - Deploy
        working-directory: ../repo-server/Docs
        run: |
          echo "=== Server version: mike deploy + ICP filing + cleanup ==="
          ./build.sh deploy server

      - name: Deploy to own server
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "../repo-server/Docs/out/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

      # =========================================================================
      # Step 2: Build GitHub Pages version (isolated clone)
      # GitHub Pages：注入 site_url → gh-pages 分支
      # =========================================================================
      - name: Build GitHub version - Prepare isolated workspace
        run: |
          echo "=== Creating isolated workspace for GitHub build ==="
          git clone . ../repo-github --no-local
          cd ../repo-github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build GitHub version - Deploy
        working-directory: ../repo-github/Docs
        run: |
          echo "=== GitHub Pages version: mike deploy + site_url + cleanup ==="
          SITE_URL="https://${{ github.repository_owner }}.github.io/flexkvm" ./build.sh deploy github

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../repo-github/Docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
