name: Deploy MkDocs Documentation

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'Docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Blacklist: tags to skip during mike deploy (space-separated)
env:
  MIKE_BLACKLIST: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for mike to read tags

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs mkdocs-material \
            mkdocs-section-index \
            mkdocs-git-revision-date-localized-plugin \
            mkdocs-minify-plugin \
            pymdown-extensions \
            markdown-checklist \
            mkdocs-static-i18n \
            mike

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # =========================================================================
      # Step 1: Build server version (isolated clone)
      # =========================================================================
      - name: Build server version - Prepare isolated workspace
        run: |
          echo "=== Creating isolated workspace for server build ==="
          git clone . ../repo-server --no-local
          cd ../repo-server
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build server version - Deploy from git tags
        working-directory: ../repo-server/Docs
        run: |
          BLACKLIST="${{ env.MIKE_BLACKLIST }}"
          BRANCH="gh-pages-server"
          REPO_ROOT=$(cd .. && pwd)
          CURRENT_BRANCH=$(git -C "$REPO_ROOT" branch --show-current)
          [ -z "$CURRENT_BRANCH" ] && CURRENT_BRANCH="main"
          DEPLOYED=0

          echo "=== Building server version from git tags ==="
          echo "Current branch: $CURRENT_BRANCH"
          echo "Repo root: $REPO_ROOT"

          for tag in $(git -C "$REPO_ROOT" tag -l "v*" | sort -V); do
            git -C "$REPO_ROOT" show "$tag:Docs/mkdocs.yml" &>/dev/null || continue
            if echo "$BLACKLIST" | grep -qw "$tag"; then
              echo "Skipped (blacklisted): $tag"
              continue
            fi
            echo "Deploying: $tag"
            # Reset any local changes before checkout
            git -C "$REPO_ROOT" checkout -- .
            git -C "$REPO_ROOT" checkout "$tag"
            mike deploy "$tag" --branch "$BRANCH" --ignore-remote-status || true
            DEPLOYED=$((DEPLOYED + 1))
          done

          echo "Returning to branch: $CURRENT_BRANCH"
          git -C "$REPO_ROOT" checkout -- .
          git -C "$REPO_ROOT" checkout "$CURRENT_BRANCH" 2>/dev/null || git -C "$REPO_ROOT" checkout main 2>/dev/null || true
          echo "Deployed $DEPLOYED historical versions"

      - name: Build server version - Deploy current as 'latest'
        working-directory: ../repo-server/Docs
        run: |
          echo "=== Deploying current version as 'latest' (server) ==="
          mike deploy "latest" --branch gh-pages-server --ignore-remote-status

      - name: Build server version - Export
        working-directory: ../repo-server/Docs
        run: |
          TEMP_DIR=".git/mike-temp-server"
          git worktree add "$TEMP_DIR" gh-pages-server
          rm -rf out-server
          cp -r "$TEMP_DIR" out-server
          git worktree remove "$TEMP_DIR" 2>/dev/null || rm -rf "$TEMP_DIR"
          printf '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>Redirecting...</title>\n<meta http-equiv="refresh" content="0; url=latest/">\n<script>window.location.href="latest/";</script>\n</head>\n<body>\n<p>Redirecting to <a href="latest/">latest/</a>...</p>\n</body>\n</html>\n' > out-server/index.html

      - name: Deploy to own server
        uses: easingthemes/ssh-deploy@v5.1.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc --delete"
          SOURCE: "../repo-server/Docs/out-server/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}

      # =========================================================================
      # Step 2: Build GitHub Pages version (isolated clone)
      # =========================================================================
      - name: Build GitHub version - Prepare isolated workspace
        run: |
          echo "=== Creating isolated workspace for GitHub build ==="
          git clone . ../repo-github --no-local
          cd ../repo-github
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build GitHub version - Inject site_url for latest
        working-directory: ../repo-github/Docs
        run: |
          echo "=== Injecting site_url into mkdocs.yml ==="
          if ! grep -q "^site_url:" mkdocs.yml; then
            sed -i '/^repo_url:/a site_url: https://chutuotek.github.io/flexkvm/' mkdocs.yml
            echo "site_url injected successfully"
          else
            echo "site_url already exists, skipping"
          fi
          grep -E "^repo_url:|^site_url:" mkdocs.yml

      - name: Build GitHub version - Deploy current as 'latest' first
        working-directory: ../repo-github/Docs
        run: |
          echo "=== Deploying current version as 'latest' (GitHub) - creating fresh branch ==="
          # Delete any existing gh-pages branch to start fresh
          git branch -D gh-pages 2>/dev/null || true
          mike deploy "latest" --branch gh-pages --ignore-remote-status

      - name: Build GitHub version - Deploy from git tags
        working-directory: ../repo-github/Docs
        run: |
          BLACKLIST="${{ env.MIKE_BLACKLIST }}"
          BRANCH="gh-pages"
          REPO_ROOT=$(cd .. && pwd)
          CURRENT_BRANCH=$(git -C "$REPO_ROOT" branch --show-current)
          [ -z "$CURRENT_BRANCH" ] && CURRENT_BRANCH="main"
          DEPLOYED=0

          echo "=== Building GitHub Pages version from git tags ==="
          echo "Current branch: $CURRENT_BRANCH"
          echo "Repo root: $REPO_ROOT"

          for tag in $(git -C "$REPO_ROOT" tag -l "v*" | sort -V); do
            git -C "$REPO_ROOT" show "$tag:Docs/mkdocs.yml" &>/dev/null || continue
            if echo "$BLACKLIST" | grep -qw "$tag"; then
              echo "Skipped (blacklisted): $tag"
              continue
            fi
            echo "Deploying: $tag"
            # Reset any local changes before checkout
            git -C "$REPO_ROOT" checkout -- .
            git -C "$REPO_ROOT" checkout "$tag"
            # Inject site_url for GitHub Pages before building
            if ! grep -q "^site_url:" mkdocs.yml; then
              sed -i '/^repo_url:/a site_url: https://chutuotek.github.io/flexkvm/' mkdocs.yml
            fi
            mike deploy "$tag" --branch "$BRANCH" --ignore-remote-status || true
            DEPLOYED=$((DEPLOYED + 1))
          done

          echo "Returning to branch: $CURRENT_BRANCH"
          git -C "$REPO_ROOT" checkout -- .
          git -C "$REPO_ROOT" checkout "$CURRENT_BRANCH" 2>/dev/null || git -C "$REPO_ROOT" checkout main 2>/dev/null || true
          echo "Deployed $DEPLOYED historical versions"

      - name: Build GitHub version - Export
        working-directory: ../repo-github/Docs
        run: |
          TEMP_DIR=".git/mike-temp"
          git worktree add "$TEMP_DIR" gh-pages
          rm -rf out
          cp -r "$TEMP_DIR" out
          git worktree remove "$TEMP_DIR" 2>/dev/null || rm -rf "$TEMP_DIR"
          printf '<!DOCTYPE html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>Redirecting...</title>\n<meta http-equiv="refresh" content="0; url=latest/">\n<script>window.location.href="latest/";</script>\n</head>\n<body>\n<p>Redirecting to <a href="latest/">latest/</a>...</p>\n</body>\n</html>\n' > out/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../repo-github/Docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
