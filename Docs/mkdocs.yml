repo_name: kalous12/FlexKVM
repo_url: https://github.com/kalous12/FlexKVM

site_name: FlexKVM Docs
site_description: Documentation for FlexKVM Productions
site_author: ChuoTuoTEK
copyright: Copyright &copy; 2026 ChuoTuoTEK
  <br/>
  <br/>
theme:
  name: material
  language: zh
  logo: images/chutuotek.ico
  favicon: images/chutuotek.ico
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - versioning
    - content.code.copy      # 代码复制按钮
    - content.tabs.link 
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en
  - section-index
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 简体中文
        - locale: en
          name: English
          nav_translations:
            首页: Home
            产品: Product
            用户指南: User Guide
            快速入门: Quick Start
            常见问题: FAQ
            故障排查: Troubleshooting
            更新日志: Changelog
            联系我们: Contact
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

extra:
  # analytics:
  #   provider: google
  #   property: G-34T6Q5NL0V
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/solid/globe
      link: https://www.chutuotek.com
    - icon: fontawesome/brands/github
      link: https://github.com/kalous12/FlexKVM

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - markdown_checklist.extension
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
        - ..
        - ../..
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition

nav:
  - 首页: index.md
  - 产品: product/index.md
  - 快速入门: quick_start/index.md
  - 用户指南:
    - 用户指南: guide/index.md
    - 设备:
      - 包装清单: guide/device/packet.md
      - 接口说明: guide/device/interface.md
      - 物理与电气特性: guide/device/characteristics.md
    - 远程控制:
      - 屏幕显示: guide/remote/screen.md
      - 鼠标: guide/remote/mouse.md
      - 键盘: guide/remote/keyboard.md
      - 截图: guide/remote/screenshot.md
      - 录像: guide/remote/record.md
    - 账号:
      - 登录: guide/acount/login.md
      - 账号管理: guide/acount/acount.md
    - 网络:
      - 以太网: guide/network/eth.md
      - WiFi: guide/network/wifi.md
      - 热点模式: guide/network/ap.md
      - 热点配网: guide/network/ap_province.md
    - 系统:
      - 硬盘挂载: guide/system/disk.md
      - ATX 电源控制: guide/system/atx.md
      - 网络唤醒 (WoL): guide/system/wakeonlan.md
      - USB 配置: guide/system/usb.md
      - HTTPS 配置: guide/system/https.md
      - SSH 远程访问: guide/system/ssh.md
      - OLED 显示: guide/system/oled.md
      - 时间设置: guide/system/time.md
      - EDID 配置: guide/system/edid.md
    - 主题与语言:
      - 主题: guide/theme/theme.md
      - 语言: guide/theme/language.md
    - 升级:
      - 离线升级: guide/upgrade/ota_offline.md
      - 在线升级: guide/upgrade/ota_online.md
    - 维护:
      - 日志: guide/maintenance/log.md
      - 审计: guide/maintenance/audit.md
      - 电源与重置: guide/maintenance/power_reset.md
    - 应用中心:
      - Tailscale: guide/app/tailscale.md
  - 常见问题: faq/index.md
  - 故障排查: troubleshooting/index.md
  - 更新日志: changelog/index.md
  - 联系我们: contact/index.md
