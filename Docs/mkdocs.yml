repo_name: chutuotek/flexkvm
repo_url: https://github.com/chutuotek/flexkvm
exclude_docs: |
  *.png

site_name: FlexKVM Docs
site_description: Documentation for FlexKVM Productions
site_author: ChuoTuoTEK
copyright: Copyright &copy; 2026 ChuoTuoTEK
  <br/>
  <br/>
theme:
  name: material
  language: zh
  logo: images/chutuotek.ico
  favicon: images/chutuotek.ico
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - versioning
    - content.code.copy      # 代码复制按钮
    - content.tabs.link 
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en
  - section-index
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 简体中文
        - locale: en
          name: English
          nav_translations:
            首页: Home
            快速入门: Quick Start
            用户指南: User Guide
            常见问题: FAQ
            故障排查: Troubleshooting
            更新日志: Changelog
            帮助与支持: Support
            常见问题与排查: Help & Diagnostics
            场景向导: Scenarios
            产品概览: Product Overview
            设备交互: Device Interaction
            OLED 屏幕: OLED Screen
            LED 指示灯: LED Indicator
            物理按键: Physical Buttons
            远程重装系统: Remote OS Install
            外网远程访问: Remote Access
            日常运维: Daily Operations
            安全加固: Security Hardening
            电源控制: Power Control
            文件传输: File Transfer
            问题反馈: Feedback
            网络: Network
            配网模式: Provisioning Mode
            以太网: Ethernet
            WiFi: Wi-Fi
            热点模式: AP Mode
            Tailscale 异地组网: Tailscale VPN
            网络唤醒 (WoL): Wake-on-LAN (WoL)
            HTTPS 证书: HTTPS Certificate
            SSH 远程访问: SSH Remote Access
            远程画面: Remote Display
            查看远程画面: View Remote Screen
            截图: Screenshot
            录像: Recording
            键盘与鼠标: Keyboard & Mouse
            鼠标: Mouse
            键盘: Keyboard
            音频: Audio
            存储与镜像: Storage & ISO Image
            存储管理: Storage Management
            外设: Peripherals
            ATX 电源控制: ATX Power Control
            系统配置: System Configuration
            关于设备: About Device
            安全设置: Security Settings
            账号管理: Account Management
            登录管理: Login Management
            账号安全: Account Security
            外观: Appearance
            时间与日期: Time & Date
            USB 配置: USB Configuration
            蓝牙: Bluetooth
            固件升级: Firmware Upgrade
            在线升级: Online Upgrade
            离线升级: Offline Upgrade
            维护与诊断: Maintenance & Diagnostics
            系统日志: System Logs
            操作审计: Audit Logs
            系统维护: System Maintenance
            重启设备: Reboot
            恢复出厂设置: Factory Reset
            线刷镜像: Flash Firmware
            扩展 IO: Peripheral IO
            UART 串口终端: UART Serial Terminal
            GPIO 引脚控制: GPIO Control
            硬件参考: Product Overview
            包装清单: Package Contents
            接口说明: Interface Overview
            物理与电气特性: Specifications
            拓展配件: Accessories & Expansion
            社区与联系: Community & Contact
            建议反馈: Feedback
            用户社群: Community
            联系我们: Contact
            LED 设置: LED Settings
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

extra:
  # analytics:
  #   provider: google
  #   property: G-34T6Q5NL0V
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/solid/globe
      link: https://www.chutuotek.com
    - icon: fontawesome/brands/github
      link: https://github.com/chutuotek/flexkvm

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - markdown_checklist.extension
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
        - ..
        - ../..
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition

nav:
  - 首页: index.md
  - 快速入门: quick_start/index.md
  - 用户指南:
    - 产品概览:
      - 包装清单: guide/product/packet.md
      - 接口说明: guide/product/interface.md
      - 物理与电气特性: guide/product/characteristics.md
      - 拓展配件: guide/product/extensibility.md
    - 场景向导: guide/scenarios/index.md
    - 设备交互:
      - OLED 屏幕: guide/interaction/oled.md
      - LED 指示灯: guide/interaction/led.md
      - 物理按键: guide/interaction/button.md
    - 网络:
      - 配网模式: guide/network/provision.md
      - 以太网: guide/network/eth.md
      - WiFi: guide/network/wifi.md
      - 热点模式: guide/network/ap.md
      - Tailscale 异地组网: guide/network/tailscale.md
      - 网络唤醒 (WoL): guide/network/wol.md
    - 远程画面:
      - 查看远程画面: guide/display/screen.md
      - 截图: guide/display/screenshot.md
      - 录像: guide/display/recording.md
    - 键盘与鼠标:
      - 鼠标: guide/input/mouse.md
      - 键盘: guide/input/keyboard.md
    - 音频: guide/audio/index.md
    - 存储管理: guide/storage/disk.md
    - ATX 电源控制: guide/peripherals/atx.md
    - 扩展 IO:
      - UART 串口终端: guide/io/uart.md
      - GPIO 引脚控制: guide/io/gpio.md
    - 系统配置:
      - 关于设备: guide/system/about.md
      - 外观: guide/system/appearance.md
      - 时间与日期: guide/system/time.md
      - USB 配置: guide/system/usb.md
      - 蓝牙: guide/system/bluetooth.md
    - 安全设置:
      - 登录管理: guide/security/account/login.md
      - 账号安全: guide/security/account/account.md
      - SSH 远程访问: guide/security/ssh.md
      - HTTPS 证书: guide/security/https.md
      - 操作审计: guide/security/audit.md
    - 系统维护:
      - 在线升级: guide/maintenance/upgrade-online.md
      - 离线升级: guide/maintenance/upgrade-offline.md
      - 重启设备: guide/maintenance/reboot.md
      - 恢复出厂设置: guide/maintenance/factory-reset.md
      - 系统日志: guide/maintenance/log.md
      - 线刷镜像: guide/maintenance/flash.md
  - 常见问题与排查:
    - 常见问题: support/faq/index.md
    - 故障排查: support/troubleshooting/index.md
  - 社区与联系:
    - 建议反馈: community/feedback/index.md
    - 用户社群: community/social/index.md
    - 联系我们: community/contact/index.md
  - 更新日志: changelog/index.md
