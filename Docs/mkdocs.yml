repo_name: chutuotek/flexkvm
repo_url: https://github.com/chutuotek/flexkvm

site_name: FlexKVM Docs
site_description: Documentation for FlexKVM Productions
site_author: ChuoTuoTEK
copyright: Copyright &copy; 2026 ChuoTuoTEK
  <br/>
  <br/>
theme:
  name: material
  language: zh
  logo: images/chutuotek.ico
  favicon: images/chutuotek.ico
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - versioning
    - content.code.copy      # 代码复制按钮
    - content.tabs.link 
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - zh
        - en
  - section-index
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 简体中文
        - locale: en
          name: English
          nav_translations:
            首页: Home
            快速入门: Quick Start
            用户指南: User Guide
            常见问题: FAQ
            故障排查: Troubleshooting
            更新日志: Changelog
            帮助与支持: Support
            常见问题与排查: Help & Diagnostics
            场景向导: Scenarios
            远程重装系统: Remote OS Install
            外网远程访问: Remote Access
            日常运维: Daily Operations
            安全加固: Security Hardening
            问题反馈与建议: Feedback & Suggestions
            社区与联系: Community & Contact
            建议反馈: Feedback
            用户社群: Community
            联系我们: Contact
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      fallback_to_build_date: true
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

extra:
  # analytics:
  #   provider: google
  #   property: G-34T6Q5NL0V
  version:
    provider: mike
    default: stable
    alias: true
  social:
    - icon: fontawesome/solid/globe
      link: https://www.chutuotek.com
    - icon: fontawesome/brands/github
      link: https://github.com/chutuotek/flexkvm

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

markdown_extensions:
  - markdown_checklist.extension
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - docs
        - ..
        - ../..
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - admonition

nav:
  - 首页: index.md
  - 快速入门: quick_start/index.md
  - 用户指南:
    - 用户指南: guide/index.md
    - 场景向导:
      - 远程重装系统: guide/scenarios/reinstall-os.md
      - 外网远程访问: guide/scenarios/remote-access.md
      - 安全加固: guide/scenarios/security.md
      - 文件传输: guide/scenarios/file-transfer.md
      - 电源控制: guide/scenarios/power-control.md
    - 产品信息:
      - 接口说明: guide/hardware/interface.md
      - 物理与电气特性: guide/hardware/characteristics.md
      - 背板: guide/hardware/backplate.md
      - 拓展: guide/hardware/extensibility.md
    - 工具栏:
      - 屏幕显示: guide/toolbar/screen.md
      - 鼠标: guide/toolbar/mouse.md
      - 键盘: guide/toolbar/keyboard.md
      - 截图: guide/toolbar/screenshot.md
      - 录像: guide/toolbar/record.md
      - ATX 电源控制: guide/toolbar/atx.md
      - 网络唤醒 (WoL): guide/toolbar/wakeonlan.md
      - 硬盘挂载: guide/toolbar/disk.md
    - 设置:
      - 账号:
        - 登录: guide/settings/account/login.md
        - 账号管理: guide/settings/account/account.md
      - 网络:
        - 以太网: guide/settings/network/eth.md
        - WiFi: guide/settings/network/wifi.md
        - 热点模式: guide/settings/network/ap.md
        - 热点配网: guide/settings/network/ap_province.md
      - 系统:
        - USB 配置: guide/settings/system/usb.md
        - HTTPS 配置: guide/settings/system/https.md
        - SSH 远程访问: guide/settings/system/ssh.md
        - OLED 显示: guide/settings/system/oled.md
        - 时间设置: guide/settings/system/time.md
        - EDID 配置: guide/settings/system/edid.md
      - 主题与语言: guide/settings/theme/theme.md
      - 升级:
        - 离线升级: guide/settings/upgrade/ota_offline.md
        - 在线升级: guide/settings/upgrade/ota_online.md
      - 维护:
        - 日志: guide/settings/maintenance/log.md
        - 审计: guide/settings/maintenance/audit.md
        - 重启与重置: guide/settings/maintenance/power_reset.md
      - 应用中心:
        - Tailscale: guide/settings/app/tailscale.md
  - 常见问题与排查:
    - 常见问题与排查: support/index.md
    - 常见问题: support/faq/index.md
    - 故障排查: support/troubleshooting/index.md
  - 社区与联系:
    - 社区与联系: community/index.md
    - 建议反馈: community/feedback/index.md
    - 用户社群: community/social/index.md
    - 联系我们: community/contact/index.md
  - 更新日志: changelog/index.md
